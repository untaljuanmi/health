@let _loading = loading();
@let _state = state();

<main>
  <div class="page-header">
    <h1 class="page-header-title">
      <span class="mat-icon mat-icon-3xl text-my-primary-default select-none">home</span>
      {{ 'home.title' | translate }}
    </h1>
    <div class="border-my-primary-default flex items-center justify-center rounded-lg border-2 px-1.5 py-0.5">
      <span class="font-body-2xs text-my-primary-default">{{ appVersion }}</span>
    </div>
  </div>

  <div class="page-content">
    <div class="flex flex-col gap-2">
      <h2 class="font-subtitle-lg flex items-center gap-1 select-text">
        {{ 'home.healthEventsCount' | translate }}
        @if (_loading) {
          <span class="mat-icon mat-icon-lg animate-spin">progress_activity</span>
        }
      </h2>
      <div class="page-content-box select-text">
        <div class="flex items-center justify-between">
          <span class="font-body-lg">{{ 'home.thisMonth' | translate }}</span>
          <span class="font-body-lg">{{ _state.month }}</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="font-body-lg">{{ 'home.thisYear' | translate }}</span>
          <span class="font-body-lg">{{ _state.year }}</span>
        </div>
      </div>
    </div>
  </div>
</main>
