<main>
  <div class="page-header">
    <h1 class="page-header-title">
      <span class="mat-icon mat-icon-3xl text-my-primary-default">event</span>
      {{ 'healthEvents.title' | translate }}
    </h1>
    <button class="my-button primary pl-8" (click)="onClickAddHealthEvent()">
      <span class="mat-icon mat-icon-2xl">add</span>
      {{ 'common.buttons.record' | translate }}
    </button>
  </div>

  <div class="page-content">
    <div class="page-content-box">
      @for (_healthEvent of healthEvents(); track $index) {
        <app-health-event-card [healthEvent]="_healthEvent" />
      } @empty {
        <div class="flex min-h-41 flex-col items-center justify-center py-4 transition-all">
          @if (loading()) {
            <span class="mat-icon mat-icon-3xl text-my-secondary-default animate-spin">progress_activity</span>
          } @else {
            <span class="mat-icon mat-icon-5xl text-my-secondary-500 mb-4">calendar_today</span>
            <p class="font-body-lg text-my-secondary-500 mb-2 max-w-120 text-center">
              {{ 'healthEvents.noEvents' | translate }}
            </p>
            <p class="font-body-lg text-my-secondary-500 max-w-120 text-center">
              {{ 'healthEvents.everythingSeemsAlright' | translate }}
            </p>
          }
        </div>
      }
    </div>
  </div>
</main>
