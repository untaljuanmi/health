@let _pageIcon = pageIcon();
@let _pageTitle = pageTitle();

<main class="flex h-full w-full flex-col overflow-auto select-none">
  @if (_pageTitle) {
    <header class="bg-my-secondary-50 sticky top-0 flex min-h-19 items-center justify-between gap-3 p-4 shadow-md">
      <h1 class="font-subtitle-4xl text-my-secondary-900 flex items-center gap-2 overflow-hidden select-text">
        @if (_pageIcon) {
          <span class="mat-icon mat-icon-3xl text-my-primary-default select-none">{{ _pageIcon }}</span>
        }
        <span class="truncate">{{ _pageTitle | translate }}</span>
      </h1>
      @if (showAddButton()) {
        <button class="my-button primary" (click)="addClicked.emit()">
          <span class="mat-icon">add</span>
          {{ 'common.buttons.add' | translate }}
        </button>
      }
    </header>
  }

  <div class="flex flex-1 flex-col gap-4 overflow-auto px-4 pt-4 pb-26">
    <ng-content />
  </div>
</main>
